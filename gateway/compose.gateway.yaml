name: strato-app-gateway

services:
  gateway:
    image: docker.io/library/caddy:2.10.2-alpine@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    read_only: true
    cap_drop: ["ALL"]
    # The official Caddy binary carries NET_BIND_SERVICE as a file capability.
    # Keeping it in the bounding set is required even though this gateway uses 8080.
    # Canonical Snap Docker cannot exec that file-capability binary with no-new-privileges.
    cap_add: ["NET_BIND_SERVICE"]
    tmpfs:
      - /config:size=16m,mode=0700
      - /data:size=16m,mode=0700
    volumes:
      - type: bind
        source: ${GATEWAY_RELEASE_DIR:?}/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ${GATEWAY_ROOT:?}/routes
        target: /etc/caddy/routes
        read_only: true
    expose:
      - "8080"
    networks:
      strato-ingress:
        aliases:
          - strato-app-gateway
      strato-app-edge: {}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/_gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  strato-ingress:
    external: true
    name: strato-ingress
  strato-app-edge:
    external: true
    name: strato-app-edge
